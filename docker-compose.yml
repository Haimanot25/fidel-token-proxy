version: '3.8'

services:
  fidel-token-proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://api.openai.com/v1}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - DB_PATH=/data/fidel.db
      - CACHE_ENABLED=true
      - NORMALIZE_ENABLED=true
    volumes:
      - fidel_data:/data
    restart: unless-stopped

volumes:
  fidel_data:
